# Chameleon96 SD card image (assembled by genimage in post-image.sh).
#
# The HPS boot ROM reads the SPL+U-Boot image from the A2 area at offset 1M
# of the card, so that region lives outside (before) the bootable partition.
# MBR slot numbers must match the README layout (root=/dev/mmcblk0p2), so the
# partitions are declared in slot order even though their physical offsets are
# not.

image sdcard.img {
	hdimage {
	}

	partition linux {
		partition-type = 0xb
		bootable = true
		offset = 12M
		size = 100M
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		offset = 112M
		size = 300M
		image = "rootfs.ext4"
	}

	partition a2 {
		partition-type = 0xa2
		offset = 1M
		size = 10M
		image = "u-boot-with-spl.sfp"
	}
}

image boot.vfat {
	vfat {
		files = {
			"u-boot.scr",
			"zImage",
			"socfpga_cyclone5_chameleon96.dtb",
			"Menu_MiSTer.rbf",
			"extlinux",
		}
	}
	size = 100M
}