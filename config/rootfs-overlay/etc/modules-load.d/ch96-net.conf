# Modules to load at boot, read by /etc/init.d/S11modules.
#
# WHY THIS FILE HAS TO EXIST
#
# This rootfs is built with BR2_ROOTFS_DEVICE_CREATION_DYNAMIC_DEVTMPFS=y and
# neither mdev nor eudev. devtmpfs creates the device nodes and stops there:
# nothing is listening for "a new USB device appeared" and nothing ever calls
# modprobe. A driver built as a module is therefore NEVER loaded on its own,
# no matter how correct modules.alias is.
#
# That is why a Realtek adapter can show up in the kernel's USB device list
# and still produce no eth0 -- the device was enumerated, but r8152 was never
# loaded, so no driver claimed it.
#
# Loading it here fixes hot-plug at the same time: a USB driver that is
# already resident binds to its device whenever that device turns up, so an
# adapter plugged in after boot is claimed too. What it will not do is ask for
# an address -- see Scripts/net_up.sh.

# Realtek RTL8152 / RTL8153 USB Ethernet
r8152
