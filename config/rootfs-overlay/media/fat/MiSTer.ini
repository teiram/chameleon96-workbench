; MiSTer.ini for Chameleon96
; The TDA19988 on this board is configured manually at boot (S99hdmi) for
; 1280x720@60, so VIDEO_MODE must stay in sync: 16 = 1280x720@60.
[MiSTer]
; 16 = 1280x720@60
video_mode=0
;debug=1

; Scaling: the menu/core framebuffer is scaled to video_mode.
vscale_mode=0
vscale_border=10
forced_scandoubler=0
vga_scaler=0

; Timings straight to the TDA19988; it is not EDID-capable here.
vsync_adjust=0
dvi_mode=0
hdmi_limited=0

; Menu core
menu_pal=0
bootscreen=0

; Scripts run from the OSD get a real framebuffer console instead of the
; 32-column OSD window: Main_MiSTer switches to tty2 and runs the script under
; /sbin/agetty, which gives 80 columns and scrollback. This is MiSTer's own
; default (cfg.cpp), written out here because it decides what the rootfs has
; to contain -- /bin/bash, /sbin/agetty, and no getty on tty1..tty6 (see
; ../../etc/inittab).
;
; Set it to 0 to fall back to the OSD window, which needs neither.
fb_terminal=1

[Menu]
video_mode=0
